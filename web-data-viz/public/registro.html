<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo | OPUS</title>
    <link rel="stylesheet" href="./css/estudo.css">
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;400;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <section class="nav-container">

            <div class="navbar-left">
                <span>Olá, <b id="b_usuario">Usuário</b></span>
            </div>

            <div class="navbar-center">
                <a href="#">Registre seu Estudo</a>
                <a href="dashboard.html">Dashboard</a>
            </div>

            <div class="navbar-right">
                <button onclick="limparSessao()">Sair</button>
            </div>

        </section>
    </header>

    <div class="container">
        <h1>Registrar Estudo</h1>

        <div class="input-box">
            <input type="number" placeholder="Horas de Estudo" id="ipt_horas">
            <i class='bx bxs-time-five'></i>
        </div>

        <div class="input-box">
            <select id="sel_compositor" required>
                <option value="" disabled selected>Selecione o Compositor</option>

                <option value="1">Frédéric Chopin</option>
                <option value="2">Johann Sebastian Bach</option>
                <option value="3">Franz Liszt</option>
                <option value="4">Ludwig van Beethoven</option>
                <option value="5">Sergei Rachmaninoff</option>
            </select>
            
            <i class='bx bxs-music'></i>
        </div>

        <div class="input-box">
            <input type="text" placeholder="Técnica" id="ipt_tecnica">
        </div>

        <button class="registrar-btn" onclick="registrar()">Registrar Estudo</button>
    </div>

    <script>

        function registrar() {

            alert("Estudo registrado!");

            let horasVar = ipt_horas.value.trim();
            let compositorVar = sel_compositor.value;
            let tecnicaVar = ipt_tecnica.value.trim();
            let idUsuarioVar = sessionStorage.ID_USUARIO;

            let ax_erro = false;


            if (horasVar == '' || compositorVar == '' || tecnicaVar == '') {
                alert(`Todos os campos são obrigatórios`)
                ax_erro = true;
            }

            if (ax_erro == false) {
                fetch("/estudo/cadastrar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        horasServer: horasVar,
                        compositorServer: compositorVar,
                        tecnicaServer: tecnicaVar,
                        idUsuarioServer: idUsuarioVar
                    })
                }).then(function (resposta) {

                    if (resposta.ok) {
                        console.log("Estudo registrado com sucesso")
                        window.location = "dashboard.html";
                    } else {
                        throw ("Houve um erro no registro!");
                    }
                }).catch(function (erro) {
                    console.log(`#ERRO ${erro}`)
                })

                return false;
            }
        }

        function limparSessao(){
            sessionStorage.clear();
            window.location = "index.html";
        }

        window.onload = function(){
            let nome = sessionStorage.NOME_USUARIO;

            if(nome != undefined){
                b_usuario.innerHTML = nome;
            } else{
                window.location = "login.html";
            }
        }
    </script>
</body>

</html>
