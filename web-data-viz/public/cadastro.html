<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OPUS | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/cadastro.css">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@200&family=Roboto:wght@200&display=swap">
</head>

<body>

  <div class="container">

    <h1>Cadastro | OPUS</h1>

    <div class="input-box">
      <input placeholder="Usuário" id="ipt_usuario">
      <i class="bx bxs-user"></i>
      <span id="validacao_usuario" class="msg_validacao"></span>
    </div>

    <div class="input-box">
      <input placeholder="Email" id="ipt_email">
      <i class="bx bxs-envelope"></i>
      <span id="validacao_email" class="msg_validacao"></span>
    </div>

    <div class="input-box">
      <input placeholder="Senha" id="ipt_senha" type="password">
      <i class="bx bxs-lock-alt"></i>
      <span id="validacao_senha" class="msg_validacao"></span>
    </div>

    <div class="input-box">
      <input placeholder="Confirme sua Senha" id="ipt_conf_senha" type="password">
      <i class="bx bxs-lock-alt"></i>
      <span id="validacao_confSenha" class="msg_validacao"></span>
    </div>

    <button class="cadastro" type="submit" onclick="cadastrar()">Cadastre-se</button>

  </div>
</body>

</html>

<script>


  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo

    let usuario = ipt_usuario.value.trim();
    let email = ipt_email.value.trim();
    let senha = ipt_senha.value.trim();
    let confSenha = ipt_conf_senha.value.trim();

    let qtdNumero = 0;
    let caracterEspecial = '!@#$%&*'
    let possuiCaracEspecial = false;

    let ax_erro = false;

    // Aqui da um reset nas mensagens de validação
    validacao_usuario.style.display = "none";
    validacao_email.style.display = "none";
    validacao_senha.style.display = "none";
    validacao_confSenha.style.display = "none";


    if (usuario == '') {
      validacao_usuario.innerHTML = `Campo Obrigatório`;
      validacao_usuario.style.display = "block";
      ax_erro = true;
    }

    if (email == '') {
      validacao_email.innerHTML = `Campo Obrigatório`;
      validacao_email.style.display = "block";
      ax_erro = true;
    }
    else if (email.indexOf('@') < 0) {
      validacao_email.innerHTML = `Insira um email válido`;
      validacao_email.style.display = "block";
      ax_erro = true;
    }

    for (ind = 0; ind < senha.length; ind++) {
      let caracAtual = senha[ind];

      if (caracAtual >= '0' && caracAtual <= '9') {
        qtdNumero++;
      }
      else if (caracterEspecial.indexOf(caracAtual) >= 0) {
        possuiCaracEspecial = true;
      }
    }

    if (senha == '') {
      validacao_senha.innerHTML = `Campo Obrigatório`
      validacao_senha.style.display = "block";
      ax_erro = true;
    }

    else if (senha.length < 8) {
      validacao_senha.innerHTML = `Senha muito curta! Mínimo 8 caracteres`
      validacao_senha.style.display = "block";
      ax_erro = true;
    }
    else if (qtdNumero < 2) {
      validacao_senha.innerHTML = `Senha fraca! Insira ao menos 2 números`
      validacao_senha.style.display = "block";
      ax_erro = true;
    }
    else if (!possuiCaracEspecial) {
      validacao_senha.innerHTML = `Senha fraca! Insira ao menos 1 caracter especial (!@#$%&*)`
      validacao_senha.style.display = "block";
      ax_erro = true;
    }


    if (confSenha == '') {
      validacao_confSenha.innerHTML = `Campo Obrigatório`;
      validacao_confSenha.style.display = "block";
      ax_erro = true;
    }

    else if (senha != confSenha) {
      validacao_confSenha.innerHTML = `As senhas não coincidem`;
      validacao_confSenha.style.display = "block";
      ax_erro = true;
    }


    if (ax_erro == false) {
      // Enviando o valor da nova input
      fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          // crie um atributo que recebe o valor recuperado aqui
          // Agora vá para o arquivo routes/usuario.js
          nomeServer: usuario,
          emailServer: email,
          senhaServer: senha,
        }),
      })
        .then(function (resposta) {
          console.log("resposta: ", resposta);
          if (resposta.ok) {
            alert("Cadastro realizado com sucesso! Redirecionando para tela de Login...");
            setTimeout(() => {
              window.location = "login.html";
            }, "2000");

          } else {
            throw "Houve um erro ao tentar realizar o cadastro!";
          }
        })
        .catch(function (resposta) {
          console.log(`#ERRO: ${resposta}`);
        });

      return false;
    }

  }
</script>
